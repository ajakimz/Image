<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
  </head>
  <body>
    <a-scene>
      <!-- BILL -->
      <a-assets>
        <a-asset-item id="Bill" src="assets/weirdmageddon-bill/scene.gltf">
        <a-asset-item>
      </a-assets>

      <a-entity 
        gltf-model="#Bill"
        position="0 15 -50"
        rotation="0 0 0"
        scale="0.3 0.3 0.3"
        animation="property: position; 
             dir: alternate; 
             dur: 2000; 
             easing: easeInOutSine; 
             to: 0 17 -50; 
             loop: true"
        animation__rotate="property: rotation;
                     to: 0 360 0;
                     loop: true;
                     dur: 8000;
                     easing: linear">
      </a-entity>

      <!-- MYSTERY SHACK -->
      <a-assets>
        <a-asset-item id="mystery-shack" src="assets/mystery-shack/scene.gltf">
        <a-asset-item>
      </a-assets>

      <a-entity 
        gltf-model="#mystery-shack"
        position="-40 0 -20"
        rotation="0 0 0"
        scale="0.8 0.8 0.8"
        animation="property: position;
             dir: alternate;
             to: -40 1.5 -20;
             dur: 80;
             loop: true;
             easing: linear"
        animation__rotate="property: rotation;
                     dir: alternate;
                     to: 10 5 3;
                     dur: 150;
                     loop: true;
                     easing: linear">
      </a-entity>

      <!-- BACKGROUND -->
      <a-sky src="assets/background-space-red.jpg"></a-sky>
    </a-scene>
  </body>
</html>
