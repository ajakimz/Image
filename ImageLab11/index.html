<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
  </head>
  <body>
    <a-scene>
      <!-- BILL -->
      <a-assets>
        <a-asset-item id="Bill" src="assets/bill/scene.gltf">
        <a-asset-item>
      </a-assets>

      <a-entity 
        gltf-model="#Bill"
        position="0 30 -50"
        rotation="0 0 0"
        scale="0.3 0.3 0.3">
      </a-entity>

      <!-- MYSTERY SHACK -->
      <a-assets>
        <a-asset-item id="mystery-shack" src="assets/mystery-shack/scene.gltf">
        <a-asset-item>
      </a-assets>

      <a-entity 
        gltf-model="#mystery-shack"
        position="-40 0 -20"
        rotation="0 0 0"
        scale="0.8 0.8 0.8">
      </a-entity>

      <!-- BACKGROUND -->
      <a-sky src="assets/background-space.jpg"></a-sky>
    </a-scene>
  </body>
</html>
