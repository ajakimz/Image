<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
  </head>
  <body>

    <a-scene>
      <!-- Ground -->
      <a-plane 
        position="0 0 -4" 
        rotation="-90 0 0" 
        width="10" 
        height="10" 
        src="assets/sand-texture.png" 
        repeat="10 10">
      </a-plane>

      <!-- Ice Cream Cone -->
      <!-- Cone base -->
      <a-cone 
        position="-2 0.75 -5" 
        rotation="0 0 180"
        radius-bottom="0.65" 
        radius-top="0.05" 
        height="1.5" 
        src="assets/cone-texture.png">
      </a-cone>

      <!-- Ice cream scoop -->
      <a-sphere 
        position="-2 1.7 -5" 
        radius="0.7" 
        src="assets/icecream-texture.png">
      </a-sphere>

      <!-- 🍹 Beach Umbrella -->
      <!-- Umbrella pole -->
      <a-cylinder 
        position="2 1 -4.5" 
        radius="0.05" 
        height="2" 
        color="#8B4513">
      </a-cylinder>

      <!-- Umbrella top -->
      <a-cone 
        position="2 2 -4.5" 
        radius-bottom="1.2" 
        radius-top="0" 
        height="0.7" 
        src="assets/umbrella-fabric.png">
      </a-cone>

      <!-- Optional: Beach ball -->
      <a-sphere 
        position="0 0.5 -4" 
        radius="0.4" 
        src="assets/beachball-texture.png">
      </a-sphere>

      <!-- Sky background -->
      <a-sky src="assets/background new.jpg"></a-sky>
    </a-scene>

</html>
